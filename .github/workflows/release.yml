name: Release Action

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required for creating releases
  packages: write  # Required for publishing packages

jobs:
  build:
    runs-on: ubuntu-22.04  # Always build on Ubuntu 22.04 for maximum compatibility

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create virtual environment
        run: |
          uv venv .venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          pip install -e .
          pip install beautifulsoup4 lxml

      - name: Confirm dependencies were installed
        run: |
          pip show beautifulsoup4
          pip show lxml

      - name: Build binary
        id: build
        run: |
          source .venv/bin/activate
          echo "✅ Checking current directory and files"
          pwd
          ls -R

          echo "✅ Saving run.sh"
          cp dist/run.sh /tmp/run.sh
    
          echo "✅ Cleaning previous builds"
          rm -rf build/ dist/ __pycache__ .cache/pyinstaller
      
          echo "✅ Running PyInstaller"          
          pyinstaller --onefile \
            --clean \
            --strip \
            --noconfirm \
            --add-binary "/usr/lib/x86_64-linux-gnu/libm.so.6:." \
            --hidden-import=modules \
            --hidden-import=requests \
            --hidden-import=bs4 \
            --hidden-import=bs4.builder._lxml \
            --hidden-import=lxml \
            --hidden-import=lxml.etree \
            --hidden-import=xml \
            --hidden-import=xml.etree \
            --hidden-import=xml.etree.ElementTree \
            --hidden-import=xml.parsers \
            --hidden-import=xml.parsers.expat \
            --collect-submodules bs4 \
            --collect-submodules lxml \
            --collect-submodules xml \
            --collect-data bs4 \
            --collect-data lxml \
            --add-data "src/modules:modules" \
            src/apicov.py            

          echo "✅ Restoring run.sh"
          cp /tmp/run.sh dist/run.sh
    
          # Ensure binary is executable
          chmod +x dist/apicov
          chmod +x dist/run.sh
          
          # Save binary location
          echo "binary_path=$(pwd)/dist/apicov" >> $GITHUB_OUTPUT
          echo "script_path=$(pwd)/dist/run.sh" >> $GITHUB_OUTPUT
          
      - name: List build files
        run: |
          echo "Listing files in dist directory:"
          ls -la dist/

      - name: Update dist directory in repository
        run: |
          echo "Current working directory: $(pwd)"
          echo "Listing current directory contents:"
          ls -la
          
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Get the current tag
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Current tag: $TAG_NAME"
          
          # Checkout main branch (change to 'master' if that's your default branch)
          BRANCH_NAME="main"
          echo "Checking out branch: $BRANCH_NAME"
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          
          # Ensure files are executable
          echo "Setting executable permissions"
          chmod +x dist/apicov
          chmod +x dist/run.sh
          
          # Add files to git
          echo "Adding files to git"
          git add dist/apicov dist/run.sh
          echo "Committing changes"
          git commit -m "Update dist directory for $TAG_NAME [skip ci]"
          
          echo "Pushing branch"
          git push origin $BRANCH_NAME
          
          echo "Updating tag to point to new commit"
          git tag -f $TAG_NAME
          echo "Pushing tag"
          git push origin $TAG_NAME --force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apicov-binary
          path: |
            dist/apicov
            dist/run.sh

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Listing downloaded artifacts:"
          find artifacts -type f

      - name: Prepare release files
        run: |
          # Create release directory
          mkdir -p release
          
          # Copy action.yml from the repository
          cp action.yml release/action.yml

          # Copy binary and script to release directory
          mkdir -p "release/dist"
          cp "artifacts/apicov-binary/apicov" "release/dist/apicov"
          cp "artifacts/apicov-binary/run.sh" "release/dist/run.sh"
          
          # Ensure files are executable
          chmod +x "release/dist/apicov"
          chmod +x "release/dist/run.sh"

      - name: List release files and save paths
        id: list_files
        run: |
          echo "Listing files in release directory:"
          find "$GITHUB_WORKSPACE/release" -type f > file_paths.txt
          cat file_paths.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          while IFS= read -r file; do
            echo "$file" >> $GITHUB_OUTPUT
          done < file_paths.txt
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.list_files.outputs.files }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
