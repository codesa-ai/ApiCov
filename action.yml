name: 'ApiCov'
description: 'Collect API coverage data from C/C++ projects'
author: 'Code SA'
branding:
  icon: 'code'
  color: 'blue'

inputs:
  install_path:
    description: 'The directory where the build is installed'
    required: false
  root_path:
    description: 'The directory where the repo is cloned'
    required: true
  api_key:
    description: 'API key for uploading coverage data to the endpoint'
    required: true
  doxygen_path:
    description: 'Path to the Doxygen HTML files (optional)'
    required: false
  xml:
    description: 'Use XML mode for DocGen (true/false, default: false)'
    required: false
    default: 'false'
  compile:
    description: 'Compiler type (e.g., gcc). If set to "gcc", lcov will be used to generate coverage info'
    required: false
  api_source:
    description: 'Source for API extraction: "shared-libs" (default) extracts from shared library exports, "headers" parses header files directly (useful for C++ vtables)'
    required: false
    default: 'shared-libs'
  headers_dir:
    description: 'Path to directory containing header files. If not provided, defaults to install_path/include or install_path'
    required: false

runs:
  using: "composite"
  steps:
    - name: Detect Ubuntu version
      id: detect_ubuntu
      run: |
        if [[ "$(lsb_release -rs)" == "22.04" ]]; then
          echo "version=ubuntu-22.04" >> $GITHUB_OUTPUT
        else
          echo "version=ubuntu-24.04" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Debug inputs
      run: |
        echo "Debug: root_path = ${{ inputs.root_path }}"
        echo "Debug: api_key = ${{ inputs.api_key != '' && '***' || 'not set' }}"
        echo "Debug: install_path = ${{ inputs.install_path != '' && inputs.install_path || 'not set' }}"
        echo "Debug: doxygen_path = ${{ inputs.doxygen_path != '' && inputs.doxygen_path || 'not set' }}"
        echo "Debug: xml = ${{ inputs.xml != '' && inputs.xml || 'not set' }}"
        echo "Debug: compile = ${{ inputs.compile != '' && inputs.compile || 'not set' }}"
        echo "Debug: api_source = ${{ inputs.api_source != '' && inputs.api_source || 'not set' }}"
        echo "Debug: headers_dir = ${{ inputs.headers_dir != '' && inputs.headers_dir || 'not set' }}"
        echo "Debug: GITHUB_ACTION_PATH = $GITHUB_ACTION_PATH"
      shell: bash

    - name: Run APICov
      run: |
        echo "Debug: Constructing command..."
        
        # Check if binary exists
        if [[ ! -f "${GITHUB_ACTION_PATH}/dist/apicov" ]]; then
          echo "Error: apicov binary not found"
          exit 1
        fi
    
        # Make sure it's executable
    
        XML_FLAG="${{ inputs.xml == 'false' && '--no-xml' || '--xml' }}"
        
        # Build command with named arguments for optional params
        CMD="${GITHUB_ACTION_PATH}/dist/apicov \"${{ inputs.root_path }}\" \"${{ inputs.api_key }}\" --install_dir \"${{ inputs.install_path }}\" $XML_FLAG"
        
        # Only add doxygen_path if it's not empty
        if [ -n "${{ inputs.doxygen_path }}" ]; then
          CMD="$CMD --doxygen_path \"${{ inputs.doxygen_path }}\""
        fi
        
        # Only add compile if it's not empty
        if [ -n "${{ inputs.compile }}" ]; then
          CMD="$CMD --compile \"${{ inputs.compile }}\""
        fi
        
        # Only add api_source if it's not empty and not the default
        if [ -n "${{ inputs.api_source }}" ] && [ "${{ inputs.api_source }}" != "shared-libs" ]; then
          CMD="$CMD --api-source \"${{ inputs.api_source }}\""
        fi
        
        # Only add headers_dir if it's not empty
        if [ -n "${{ inputs.headers_dir }}" ]; then
          CMD="$CMD --headers-dir \"${{ inputs.headers_dir }}\""
        fi
        
        echo "Debug: Full command: $CMD"
        chmod +x "${GITHUB_ACTION_PATH}/dist/apicov"
        eval "$CMD"
      shell: bash

    - name: "Upload JSON files"
      uses: actions/upload-artifact@v4
      with:
        name: api-coverage
        path: |
          ${{inputs.root_path}}/apis.json
          ${{inputs.root_path}}/headers.json
          ${{inputs.root_path}}/api_coverage.json
          ${{inputs.root_path}}/coverage_data.tgz
        if-no-files-found: error


